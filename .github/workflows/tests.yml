name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      # ``mypy src/fast_vollib`` is not clean yet, and making it clean is
      # separate work. What is enforced is that it does not get worse: the
      # checker compares diagnostic identities against a checked-in baseline
      # and fails only on new ones, so a new error cannot hide behind a
      # removed one.
      - name: Type-check (mypy, no new diagnostics)
        run: uv run python scripts/check_mypy_baseline.py

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  test-torch:
    name: pytest / PyTorch backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install with torch extra
        run: uv sync --all-groups --extra torch

      - name: Run tests with torch backend
        run: uv run pytest tests/ -v --tb=short
        env:
          FAST_VOLLIB_BACKEND: torch
          # The job installed the torch extra, so a torch test that skips is a
          # gap in coverage rather than an absent optional dependency.
          FV_REQUIRE_BACKENDS: torch

  test-jax:
    name: pytest / JAX backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install with jax extra
        run: uv sync --all-groups --extra jax

      - name: Run tests with jax backend
        run: uv run pytest tests/ -v --tb=short
        env:
          FAST_VOLLIB_BACKEND: jax
          FV_REQUIRE_BACKENDS: jax
