name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:
  schedule:
    # Nightly: the slow implied-volatility validation sweeps (full canonical grid, held-out).
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Pre-release interpreters must not block merges; the lane still runs so
    # regressions are visible before the final release lands.
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          # Release candidate. uv resolves "3.15" to the newest available
          # build, so this lane moves to the final release without a change.
          - python-version: "3.15"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install visualization extra for plot coverage
        if: matrix.python-version == '3.12'
        run: uv sync --all-groups --extra viz

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      # ``mypy src/fast_vollib`` is not clean yet, and making it clean is
      # separate work. What is enforced is that it does not get worse: the
      # checker compares diagnostic identities against a checked-in baseline
      # and fails only on new ones, so a new error cannot hide behind a
      # removed one.
      - name: Type-check (mypy, no new diagnostics)
        run: uv run python scripts/check_mypy_baseline.py

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Check reference policy with strict mode enabled
        run: uv run pytest tests/test_reference_policy.py -q --tb=short
        env:
          FV_STRICT_REFERENCE_FIXTURES: "1"

  test-torch:
    name: pytest / PyTorch backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install with torch extra
        run: uv sync --all-groups --extra torch

      - name: Assert the pinned route (default calls run on torch)
        run: uv run pytest tests/test_ci_route_identity.py -v --tb=short
        env:
          FAST_VOLLIB_BACKEND: torch
          FV_REQUIRE_BACKENDS: torch

      - name: Run tests with torch backend
        run: uv run pytest tests/ -v --tb=short
        env:
          FAST_VOLLIB_BACKEND: torch
          # The job installed the torch extra, so a torch test that skips is a
          # gap in coverage rather than an absent optional dependency.
          FV_REQUIRE_BACKENDS: torch

  test-jax:
    name: pytest / JAX backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.15"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install with jax extra
        run: uv sync --all-groups --extra jax

      - name: Assert the pinned route (default calls run on JAX)
        run: uv run pytest tests/test_ci_route_identity.py -v --tb=short
        env:
          FAST_VOLLIB_BACKEND: jax
          FV_REQUIRE_BACKENDS: jax

      - name: Run tests with jax backend
        run: uv run pytest tests/ -v --tb=short
        env:
          FAST_VOLLIB_BACKEND: jax
          FV_REQUIRE_BACKENDS: jax

  test-numpy-only:
    name: IV validation without Numba / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      FAST_VOLLIB_BACKEND: numpy
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install base dependencies and test tools
        run: uv sync --locked

      - name: Assert NumPy-only execution
        run: >-
          uv run --no-sync python -c "from importlib.util import find_spec;
          from fast_vollib.config import get_backend;
          assert find_spec('numba') is None; assert get_backend() == 'numpy'"

      - name: Validate fixtures, canonical grid and varied-parameter sample
        run: >-
          uv run --no-sync python -m pytest tests/test_iv_adjudicated.py tests/test_iv_domain.py
          -o addopts= -q --tb=short

  test-slow:
    name: pytest / slow IV validation sweeps
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install with all CPU backends
        run: uv sync --all-groups --extra torch --extra jax --extra numba

      - name: Run slow sweeps
        run: uv run pytest tests/test_iv_domain.py -m slow -v --tb=short
        env:
          FV_REQUIRE_BACKENDS: torch,jax,numba
