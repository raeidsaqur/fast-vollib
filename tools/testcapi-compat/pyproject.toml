[project]
name = "testcapi-compat"
version = "1.0.0"
description = "Compatibility shim supplying DBL_MIN/DBL_MAX for py_lets_be_rational 1.0.x on CPython builds that omit the private _testcapi module."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
